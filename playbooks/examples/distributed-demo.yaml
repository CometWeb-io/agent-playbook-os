apiVersion: playbook.agent/v1alpha1
kind: Playbook
metadata:
  id: distributed-demo
  version: 0.6.0
  description: Minimal immutable plan suitable for queue/worker distributed execution examples.
  tags: [distributed, demo]
spec:
  inputs:
    message:
      type: string
      required: true
  steps:
    - id: emit
      type: action
      action: set
      with:
        value: "{{ inputs.message }}"
  outputs:
    message: "{{ steps.emit.output }}"
