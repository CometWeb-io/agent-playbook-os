apiVersion: playbook.agent/v1alpha1
kind: Playbook
metadata:
  id: sensitive-raw
  version: 0.4.0
  description: Adversarial fixture proving raw sensitive input is rejected.
spec:
  inputs:
    token:
      type: string
      required: true
      sensitive: true
  steps:
    - id: no-op
      type: action
      action: set
      with:
        value: safe
